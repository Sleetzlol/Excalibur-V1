    body {

    .menu-button {

        background: rgba(255,255,255,0.12);

    .setting-btn {
        width: 100%;

        margin: 10px 0;

        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 13px;
        color: white;
        font-size: 17px;
        cursor: pointer;
        transition: 0.15s;
    }

        background: rgba(255,255,255,0.22);

    .footer {

        font-size: 10px;
        opacity: 0.6;

    }

    #constellation {
        position: absolute;
        top: 0;
        width: 100%;
        height: 40%;

<body>

<canvas id="constellation"></canvas>

<!-- SETTINGS PANEL -->
<div class="settings-box">
    <h1>SETTINGS</h1>

   
    <button class="setting-btn" onclick="openBlank()">
        about:blank Cloak
    </button>

</div>

<div class="footer">Excalibur® V1.0.00</div>

<script>
/* UNIVERSAL ABOUT:BLANK CLOAKER */
function openBlank() {
    const win = window.open("about:blank", "_blank");
    if (!win) return alert("Popup blocked!");

    win.document.write(`
        <iframe src="${location.href}" style="border:0; position:fixed; top:0; left:0; width:100%; height:100%;"></iframe>
    `);

    win.document.title = document.title;
}

/* CONSTELLATION BACKGROUND */
const canvas = document.getElementById("constellation");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight * 0.40;
}
window.addEventListener("resize", resize);
resize();

const particles = [];
const particleCount = 70;

for (let i = 0; i < particleCount; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.04,
        vy: (Math.random() - 0.5) * 0.04,
        radius: 1.3
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();
    }

    for (let i = 0; i < particleCount; i++) {
        for (let j = i + 1; j < particleCount; j++) {
            let dx = particles[i].x - particles[j].x;
            let dy = particles[i].y - particles[j].y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 120) {
                ctx.beginPath();
                ctx.strokeStyle = "rgba(255,255,255,0.18)";
                ctx.lineWidth = 0.4;
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
            }
        }
    }

    requestAnimationFrame(draw);
}
draw();
</script>

</body>
